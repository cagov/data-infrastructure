version: 2

models:
  - name: snowflake_costs_by_date
    description: |
      Snowflake credits consumed across the organization, by account and date.

      Data are in long form, where `usage_type` indicates which type of usage is measured
      in credits and `service_type` gives the underlying Snowflake service type.

      Coverage is complete by construction: all compute and cloud services credits come
      from `metering_daily_history` with nothing filtered out, and storage, which that
      view does not cover, comes from `storage_daily_history`. Service types Snowflake
      introduces later are therefore counted automatically, under the `other` usage type.

      History starts at the first date for which a service type breakdown exists. Older
      credits are still held, aggregated across service types, in the
      `stg_metering_daily_history` and `stg_cortex_usage_daily_history` archives, and the
      per-feature `int_*` models still hold warehouse, pipe, automatic clustering and
      materialized view credits for that earlier window.

      Note that storage credits are notional: `storage_daily_history` derives them from
      average bytes rather than reporting a billed credit figure, because storage is
      invoiced in currency rather than credits.
    columns:
      - name: organization_name
        description: Organization name
      - name: account_name
        description: Account name
      - name: usage_date
        description: Date on which the usage occurred
      - name: service_type
        description: |
          The Snowflake service type the credits were billed under, e.g.
          `'WAREHOUSE_METERING'`, `'AI_SERVICES'`, `'QUERY_ACCELERATION'`.
      - name: usage_type
        description: |
          A friendlier grouping of `service_type`:

          * `'automatic clustering'`
          * `'cortex'`
          * `'materialized view'`
          * `'other'` — a service type we have not given a friendly name yet
          * `'pipe'`
          * `'query acceleration'`
          * `'replication'`
          * `'search optimization'`
          * `'serverless'`
          * `'snowpipe streaming'`
          * `'storage'`
          * `'warehouse'`
      - name: credits_used
        description: The credits used for the usage type and date.
